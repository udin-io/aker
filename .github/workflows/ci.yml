name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene step reads the commits this branch adds to main.
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: bin/ci
        env:
          HYGIENE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  # The install key's chip tests, against a simulated TPM 2.0 chip.
  tpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools tpm2-tools
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-tpm-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-tpm-${{ runner.os }}-
      - run: mix deps.get
      - run: mix test --only tpm
        env:
          MIX_ENV: test
